name: K7Rec
options:
  bundleIdPrefix: rocks.k7
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: S5TM69LZLJ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
packages:
  RehearsalText: {path: ../Packages/RehearsalText}
  RehearsalAudio: {path: ../Packages/RehearsalAudio}
  RehearsalStore: {path: ../Packages/RehearsalStore}
  RehearsalStems: {path: ../Packages/RehearsalStems}
  RehearsalFTP: {path: ../Packages/RehearsalFTP}
  RehearsalSFTP: {path: ../Packages/RehearsalSFTP}
targets:
  K7Rec:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - Sources
      - Resources
      - {path: Models, optional: true}
    dependencies:
      - package: RehearsalText
      - package: RehearsalAudio
      - package: RehearsalStore
      - package: RehearsalStems
      - package: RehearsalFTP
      - package: RehearsalSFTP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.k7.rec
        PRODUCT_NAME: K7Rec
        TARGETED_DEVICE_FAMILY: "1,2"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COREML_CODEGEN_LANGUAGE: None
    entitlements:
      path: Resources/K7Rec.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.rocks.k7.rec]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.rocks.k7.rec]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Resources/Info.plist
      properties:
        NSUbiquitousContainers:
          iCloud.rocks.k7.rec:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: K7 REC
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleDisplayName: K7 REC
        CFBundleName: K7 REC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        # An audio file shared from another app (the share sheet, Open in) becomes a song (docs/app.md).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: K7 REC connects to your file server to import audio files.
        NSMicrophoneUsageDescription: K7 REC records your takes with the microphone.
        ITSAppUsesNonExemptEncryption: false
  K7RecTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macCatalyst]
    sources: [Tests]
    dependencies:
      - target: K7Rec
      - package: RehearsalText
      - package: RehearsalAudio
      - package: RehearsalStore
      - package: RehearsalStems
      - package: RehearsalFTP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  K7RecUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: K7Rec
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  K7Rec:
    build:
      targets:
        K7Rec: all
    test:
      targets: [K7RecTests, K7RecUITests]
