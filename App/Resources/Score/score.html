<!doctype html>
<!-- The score page: Verovio draws a MusicXML file as one scrolling column of SVG pages (docs/score.md). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; background: #fff; }
  #pages { padding-bottom: 96px; }
  #pages svg { display: block; width: 100%; height: auto; }
  .score-playing, .score-playing * { fill: #d32f2f; stroke: #d32f2f; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1c1c1e; }
    #pages svg { filter: invert(1) hue-rotate(180deg); }
  }
</style>
</head>
<body>
<div id="pages"></div>
<script src="verovio-toolkit-wasm.js"></script>
<script src="score.js"></script>
</body>
</html>
